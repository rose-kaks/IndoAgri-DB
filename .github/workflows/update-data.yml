name: Update IndoAgri Dataset

on:
  schedule:
    # Every day at 07:30 AM IST
    # GitHub cron uses UTC, so 02:00 UTC = 07:30 IST
    - cron: "0 2 * * *"

  # Allows you to manually run it from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository + full Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the data acquisition pipeline
      - name: Run IndoAgri data pipeline
        env:
          # Add these later as GitHub Secrets
          AGMARKNET_API_KEY: ${{ secrets.AGMARKNET_API_KEY }}
          SCHEMES_API_KEY: ${{ secrets.SCHEMES_API_KEY }}

          # Tells utils.py to use Git commit timestamps
          GITHUB_ACTIONS: "true"

        run: |
          python main.py

      # 5. Commit changed processed/reference datasets
      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed data/reference

          if git diff --cached --quiet; then
            echo "No dataset changes detected."
          else
            git commit -m "chore: update agriculture datasets"
            git push
          fi
